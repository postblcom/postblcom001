name: Build APK

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'release/**'
      - 'ci-output/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Build and publish without marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set +e
          mkdir work
          cd work
          git clone "https://github.com/${REPOSITORY}.git" source
          cd source
          git checkout "$HEAD_SHA"

          mkdir -p ci-output release .gradle-dist
          exec > >(tee ci-output/build.log) 2>&1

          echo "=== Environment ==="
          date -u
          uname -a
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager || true
          ls -la "$ANDROID_HOME" || true

          echo "=== Android SDK ==="
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          SDK_STATUS=$?

          echo "=== Gradle ==="
          curl -fL --retry 3 -o .gradle-dist/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          CURL_STATUS=$?
          if [ "$CURL_STATUS" -eq 0 ]; then
            unzip -q -o .gradle-dist/gradle.zip -d .gradle-dist
            .gradle-dist/gradle-8.9/bin/gradle --version
            .gradle-dist/gradle-8.9/bin/gradle :app:assembleDebug --no-daemon --stacktrace
            BUILD_STATUS=$?
          else
            BUILD_STATUS=$CURL_STATUS
          fi

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release/InstalledAppsViewer-v1.0.0.apk
            sha256sum release/InstalledAppsViewer-v1.0.0.apk > release/SHA256SUMS.txt
          fi

          echo "$SDK_STATUS" > ci-output/sdk-status.txt
          echo "$BUILD_STATUS" > ci-output/build-status.txt
          echo "sdk_status=$SDK_STATUS build_status=$BUILD_STATUS"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-output/ release/ || true
          git commit -m "Store APK build results" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" HEAD:"${HEAD_REF}" || true

          test -f release/InstalledAppsViewer-v1.0.0.apk
          test "$BUILD_STATUS" = "0"
