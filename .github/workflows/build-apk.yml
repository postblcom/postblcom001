name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'release/**'
      - 'ci-output/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'release/**'
      - 'ci-output/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with diagnostics
        id: build
        shell: bash
        run: |
          set +e
          mkdir -p ci-output release .gradle-dist
          exec > >(tee ci-output/build.log) 2>&1

          echo "=== Environment ==="
          date -u
          uname -a
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager || true
          ls -la "$ANDROID_HOME" || true

          echo "=== Android SDK ==="
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          SDK_STATUS=$?

          echo "=== Gradle ==="
          curl -fL --retry 3 -o .gradle-dist/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          CURL_STATUS=$?
          if [ "$CURL_STATUS" -eq 0 ]; then
            unzip -q -o .gradle-dist/gradle.zip -d .gradle-dist
            .gradle-dist/gradle-8.9/bin/gradle --version
            .gradle-dist/gradle-8.9/bin/gradle :app:assembleDebug --no-daemon --stacktrace
            BUILD_STATUS=$?
          else
            BUILD_STATUS=$CURL_STATUS
          fi

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release/InstalledAppsViewer-v1.0.0.apk
            sha256sum release/InstalledAppsViewer-v1.0.0.apk > release/SHA256SUMS.txt
          fi

          echo "$SDK_STATUS" > ci-output/sdk-status.txt
          echo "$BUILD_STATUS" > ci-output/build-status.txt
          echo "sdk_status=$SDK_STATUS build_status=$BUILD_STATUS"
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InstalledAppsViewer-build-log
          path: ci-output/
          retention-days: 30

      - name: Upload APK
        if: hashFiles('release/InstalledAppsViewer-v1.0.0.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: InstalledAppsViewer-APK
          path: release/InstalledAppsViewer-v1.0.0.apk
          retention-days: 30

      - name: Publish results to branch
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-output/ release/ || true
          git commit -m "Store APK build results" || exit 0
          git push origin HEAD:${{ github.head_ref }}

      - name: Verify build succeeded
        if: always()
        shell: bash
        run: |
          test -f release/InstalledAppsViewer-v1.0.0.apk
          test "$(cat ci-output/build-status.txt)" = "0"
